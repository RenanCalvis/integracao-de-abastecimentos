
services:
  frontend:
    build:
      context: ./frontend
    platform: linux/arm64
    ports:
      - "3100:3000" 
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules 
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
    platform: linux/arm64
    ports:
      - "3101:3000" 
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://admin:password123@db:5432/abastecimentos_db
    depends_on:
      - db
      - minio

  db:
    image: postgres:15-alpine
    platform: linux/arm64
    ports:
      - "3102:5432" 
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: abastecimentos_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    platform: linux/arm64
    ports:
      - "3103:9000" # API do MinIO
      - "3104:9001" # Console do MinIO
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: